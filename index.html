<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#1a1410" />
    <title>Shadow Locks</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1410; color: #f1e6d2; font-family: system-ui, sans-serif; }
      #scene-container { position: fixed; inset: 0; }
      #enter-overlay { position: fixed; left: 0; right: 0; bottom: 8vh; display: flex; justify-content: center; pointer-events: none; }
      #enter { pointer-events: auto; font: 600 22px system-ui, sans-serif; padding: 14px 40px; border-radius: 999px; border: 0;
        background: #d9b26a; color: #1e1610; cursor: pointer; }
      #enter[hidden] { display: none; }
      #status { position: fixed; left: 0; right: 0; bottom: 3vh; text-align: center; font-size: 15px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="enter-overlay"><button id="enter" type="button" hidden>Enter</button></div>
    <div id="status">Loading</div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
