<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1410" />
    <meta name="description" content="Shadow Locks: a puzzle box for Meta Quest. Coming soon." />
    <title>Shadow Locks</title>
    <!-- The public host's placeholder until the game itself is deployed (scripts/deploy-pages.sh --placeholder). -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #1a1410; }
      body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #efe6d2;
        font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
        background: radial-gradient(ellipse at 50% 42%, #3a2a17 0%, #1c191d 48%, #0d0b0e 100%); }
      main { max-width: 34rem; padding: 44px 32px 36px; border: 1px solid #e2bd62; outline: 1px solid rgba(226, 189, 98, 0.35);
        outline-offset: 6px; background: rgba(28, 25, 29, 0.82); }
      .mark { display: block; width: 52px; height: 52px; margin: 0 auto 22px; border: 2px solid #e2bd62; transform: rotate(45deg);
        position: relative; box-shadow: 0 0 28px rgba(255, 211, 106, 0.25); }
      .mark::after { content: ""; position: absolute; inset: 10px; background: #ffd36a; }
      h1 { margin: 0; font: 400 3rem/1.1 "Limelight", "Didot", "Bodoni 72", Georgia, serif; letter-spacing: 0.04em; color: #ffd36a; }
      p { margin: 18px 0 0; font-size: 1.1rem; }
      .soon { margin-top: 6px; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.18em; text-transform: uppercase; color: #cdb27a; }
      footer { margin-top: 30px; padding-top: 16px; border-top: 1px solid rgba(226, 189, 98, 0.4); font-size: 0.9rem; }
      a { color: #ffd36a; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true"></span>
      <h1>Shadow Locks</h1>
      <p>A puzzle box for Meta Quest.</p>
      <p class="soon">Coming soon</p>
      <footer><a href="/privacy">Privacy policy</a></footer>
    </main>
  </body>
</html>
